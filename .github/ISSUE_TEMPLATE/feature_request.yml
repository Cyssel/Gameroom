name: Feature request
description: An idea to make Gameroom better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Gameroom to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The problem behind the idea helps a lot to find the best solution.
